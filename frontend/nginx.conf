server {
    listen 80;
    server_name localhost;

    # Phục vụ file tĩnh React (HTML, JS, CSS, ảnh...)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Quan trọng: React Router dùng client-side routing
        # Nếu user truy cập /login, /dashboard... Nginx cần trả về index.html
        # để React Router xử lý, thay vì trả lỗi 404
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: chuyển tiếp request /api/* sang backend container
    # Thay thế cho proxy trong vite.config.js (chỉ dùng khi dev)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
