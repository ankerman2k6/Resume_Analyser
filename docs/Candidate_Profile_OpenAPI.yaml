openapi: 3.0.3
info:
  title: Candidate Profile API
  version: 1.1.0
  description: Đặc tả API Trang cá nhân ứng viên (Resume Analyser)
servers:
  - url: http://localhost:8080/api
    description: Local Development Server

security:
  - BearerAuth: []

paths:
  /candidates/me/profile:
    get:
      summary: Lấy thông tin hồ sơ ứng viên
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          description: Chưa tạo hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      summary: Tạo hoặc cập nhật hồ sơ ứng viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '201':
          description: Tạo mới thành công
          headers:
            Location:
              schema:
                type: string
                example: /api/candidates/me/profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDto'
        '400':
          $ref: '#/components/responses/400Error'

  /candidates/me/stats:
    get:
      summary: Thống kê số lượng đơn, CV, phỏng vấn và điểm AI
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsDto'

  /candidates/me/applications:
    get:
      summary: Danh sách đơn ứng tuyển của ứng viên
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, applied, reviewing, interview, accepted, rejected, withdrawn]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPageResponse'

  /candidates/me/applications/{applicationId}/withdraw:
    post:
      summary: Rút đơn ứng tuyển
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rút đơn thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateApplicationDto'
        '409':
          description: Không thể rút đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /candidates/me/cvs:
    get:
      summary: Danh sách CV của ứng viên
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvSummaryPageResponse'

  /candidates/me/cvs/{cvId}/file:
    get:
      summary: Xem tệp PDF của CV
      parameters:
        - name: cvId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Luồng nhị phân PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Không tìm thấy tệp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /candidates/me/cvs/{cvId}:
    delete:
      summary: Xóa CV chưa sử dụng
      parameters:
        - name: cvId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Xóa thành công
        '409':
          description: CV đang được sử dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /candidates/me/career:
    get:
      summary: Kinh nghiệm & kỹ năng từ một CV
      parameters:
        - name: cvId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerDto'

  /resumes/upload:
    post:
      summary: Tải lên CV (ghi vào collection cvs)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Tải lên thành công
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvSummaryDto'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400Error:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    401Error:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    403Error:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Thông tin hồ sơ chưa hợp lệ.
        errors:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

    ProfileDto:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        fullName:
          type: string
          nullable: true
        email:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        location:
          type: object
          properties:
            city:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
        accountStatus:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      required:
        - fullName
        - phone
        - location
      properties:
        fullName:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        location:
          type: object
          required:
            - city
            - country
          properties:
            city:
              type: string
              maxLength: 120
            country:
              type: string
              maxLength: 120

    StatsDto:
      type: object
      properties:
        cvCount:
          type: integer
        applicationCount:
          type: integer
        upcomingInterviewCount:
          type: integer
        avgMatchScore:
          type: number
          nullable: true
        analyzedApplicationCount:
          type: integer
        applicationCounts:
          type: object
          properties:
            all:
              type: integer
            applied:
              type: integer
            reviewing:
              type: integer
            interview:
              type: integer
            accepted:
              type: integer
            rejected:
              type: integer
            withdrawn:
              type: integer

    CandidateApplicationDto:
      type: object
      properties:
        _id:
          type: string
        cvId:
          type: string
          nullable: true
        jobId:
          type: string
          nullable: true
        status:
          type: string
        appliedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        canWithdraw:
          type: boolean
        job:
          type: object
          nullable: true
        company:
          type: object
          nullable: true
        aiAnalysis:
          type: object
          nullable: true
        interview:
          type: object
          nullable: true

    ApplicationPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CandidateApplicationDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean

    CvSummaryDto:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        source:
          type: object
          properties:
            type:
              type: string
            fileName:
              type: string
            mimeType:
              type: string
        parseInfo:
          type: object
          properties:
            status:
              type: string
            parsedAt:
              type: string
              format: date-time
              nullable: true
            parserVersion:
              type: string
              nullable: true
        skills:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        canViewFile:
          type: boolean
        canDelete:
          type: boolean
        deleteBlockedReason:
          type: string
          nullable: true

    CvSummaryPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CvSummaryDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean

    CareerDto:
      type: object
      properties:
        cv:
          type: object
          nullable: true
        skills:
          type: array
          items:
            type: object
        experience:
          type: array
          items:
            type: object
        education:
          type: array
          items:
            type: object
        certificates:
          type: array
          items:
            type: object
