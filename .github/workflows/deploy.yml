name: Deploy to Home Server

on:
  push:
    branches: [ web ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          cd ${{ github.workspace }}
          docker compose down || true
          docker compose up -d --build
          docker image prune -f
