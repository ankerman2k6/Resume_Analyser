<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <title>{{PAGE_TITLE}}</title>
  <style type="text/css">
    @page { size: A4; margin: 15mm 17mm 18mm 17mm; }
    body { font-family: 'DejaVu Sans', sans-serif; font-size: 9.4pt; line-height: 1.48; color: #1b2938; margin: 0; }
    .cv-header { background: #102638; color: #ffffff; padding: 17px 19px 15px 19px; margin-bottom: 19px; }
    .cv-name { color: #ffffff; font-size: 22pt; line-height: 1.14; font-weight: 700; margin: 0 0 9px 0; }
    .cv-contact { color: #deebf1; font-size: 8.6pt; margin: 0 0 4px 0; }
    .cv-links { color: #9ce7db; font-size: 8.4pt; margin: 0; word-wrap: break-word; }
    .cv-section { margin: 0 0 16px 0; }
    .cv-section-title { font-size: 10pt; color: #0d5c67; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 2px solid #1c8c95; padding: 0 0 5px 0; margin: 0 0 9px 0; }
    .cv-summary, .cv-entry-desc { color: #2b3b4d; margin: 0; }
    .cv-entry { margin: 0 0 12px 0; page-break-inside: avoid; }
    .cv-entry-header { width: 100%; border-collapse: collapse; }
    .cv-entry-title { color: #102638; font-weight: 700; font-size: 9.5pt; }
    .cv-entry-dates { color: #53707d; font-size: 8pt; text-align: right; white-space: nowrap; }
    .cv-entry-subtitle { color: #0e6972; font-size: 8.8pt; font-style: italic; margin-top: 2px; }
    .cv-entry-desc { margin-top: 4px; }
    .cv-skills-list { margin: 0; }
    .cv-skill-item { display: inline-block; background: #e8f3f3; border-left: 2px solid #1c8c95; color: #14515a; font-size: 8.4pt; padding: 4px 7px; margin: 0 5px 6px 0; }
  </style>
</head>
<body>
  <div class="cv-header">
    <h1 class="cv-name">{{FULL_NAME}}</h1>
    <p class="cv-contact">{{CONTACT_LINE}}</p>
    {{LINKS_BLOCK}}
  </div>
  {{SUMMARY_SECTION}}
  {{SKILLS_SECTION}}
  {{EXPERIENCE_SECTION}}
  {{EDUCATION_SECTION}}
</body>
</html>
