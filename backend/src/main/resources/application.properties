spring.application.name=backend
server.port=8081
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.mongodb.uri=mongodb://localhost:27017/cv_screening

jwt.secret=resume-analyser-jwt-secret-key-for-development-2026-change-me
jwt.expiration=86400000

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.dir=uploads/resumes
