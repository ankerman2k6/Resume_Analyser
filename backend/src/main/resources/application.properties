spring.application.name=backend
# JWT authentication không dùng user/password mặc định do Boot sinh ra.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.mongodb.uri=mongodb://localhost:27017/cv_screening

jwt.secret=resume-analyser-jwt-secret-key-for-development-2026-change-me
jwt.expiration=86400000

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
