spring.application.name=backend
# JWT authentication không dùng user/password mặc định do Boot sinh ra.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.mongodb.uri=mongodb://localhost:27017/cv_screening

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Health includes MongoDB connectivity; expose no diagnostic details publicly.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=5MB
# Allow multipart headers in addition to the 5MB file payload.
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads/resumes

# Gemini API — key chỉ đọc từ biến môi trường, không ghi trực tiếp vào file này.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/}
app.gemini.timeout=${GEMINI_TIMEOUT:90s}
