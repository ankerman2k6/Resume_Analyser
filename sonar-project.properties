# ==========================================================
# Cấu hình SonarQube Scanner cho Resume Analyser
# ==========================================================

# Định danh duy nhất của dự án trên SonarQube
sonar.projectKey=resume-analyser
sonar.projectName=Resume Analyser

# Đường dẫn chứa mã nguồn cần quét (quét cả Backend Java và Frontend React)
sonar.sources=backend/src/main,frontend/src

# Đường dẫn chứa mã kiểm thử (Unit tests)
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*Test.java,**/*Tests.java

# Loại bỏ các thư mục thư viện, file sinh tự động không cần quét
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,**/*.config.js,**/setupTests.js

# Cấu hình cho mã Java (bắt buộc đối với SonarQube)
sonar.java.binaries=backend/target/classes

# Mã hóa file
sonar.sourceEncoding=UTF-8
