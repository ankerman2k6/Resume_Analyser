# ==========================================================
# Docker Compose - Resume Analyser (Full Stack + Database)
# Tích hợp trọn gói MongoDB (có sẵn dữ liệu) + Backend + Frontend
# ==========================================================

services:

  # --- Database MongoDB (Đã đóng gói sẵn 100% dữ liệu cv_screening) ---
  mongodb:
    image: ${MONGO_IMAGE:-antony1552006/resume-mongodb}:${VERSION:-latest}
    container_name: resume-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Lưu trữ các dữ liệu mới tạo thêm sau này
      - mongo-data:/data/db
    networks:
      - resume-network
    restart: always

  # --- Backend (Spring Boot API) ---
  backend:
    image: ${BACKEND_IMAGE:-antony1552006/resume-backend}:${VERSION:-latest}
    build:
      context: ./backend
    container_name: resume-backend
    ports:
      - "8081:8081"
    environment:
      # Kết nối trực tiếp tới container mongodb bên trên
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/cv_screening
    depends_on:
      - mongodb
    networks:
      - resume-network
    restart: always

  # --- Frontend (React + Nginx) ---
  frontend:
    image: ${FRONTEND_IMAGE:-antony1552006/resume-frontend}:${VERSION:-latest}
    build:
      context: ./frontend
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

# Volume lưu trữ dữ liệu database
volumes:
  mongo-data:

# Network kết nối 3 container
networks:
  resume-network:
    name: resume-network
    external: true