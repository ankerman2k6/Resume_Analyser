# =============================================
# Docker Compose - Resume Analyser
# Kết nối Backend + Frontend
# (MongoDB dùng container "local-mongo" đã có sẵn)
# =============================================

services:

  # --- Backend (Spring Boot) ---
  backend:
    build:
      context: ./backend
    container_name: resume-backend
    ports:
      - "8080:8080"
    environment:
      # Dùng host.docker.internal để truy cập container local-mongo
      # đang chạy trên máy host (port 27017)
      - SPRING_MONGODB_URI=mongodb://host.docker.internal:27017/cv_screening

  # --- Frontend (React + Nginx) ---
  frontend:
    build:
      context: ./frontend
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
